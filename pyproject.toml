[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stablefit"
version = "0.1.0"
description = "Jointly learn sample weights AND feature weights to minimize the train-CV gap (stability/anti-overfit) — feature weights from cross-fold coefficient stability, sample weights from local consensus, held-out + null validated. numpy-only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott" }]
keywords = ["machine-learning", "overfitting", "sample-weighting", "feature-weighting",
            "cross-validation", "stability", "robust", "tabular", "kaggle"]
dependencies = ["numpy>=1.21"]

[project.scripts]
stablefit = "stablefit.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["stablefit"]
